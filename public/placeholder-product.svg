<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" fill="none">
  <!-- Subtle neutral canvas matching luxury product card backgrounds -->
  <rect width="400" height="400" fill="#f8f8f8"/>

  <!-- Subtle inner framing -->
  <rect x="2" y="2" width="396" height="396" stroke="#eeeeee" stroke-width="2" rx="4"/>

  <!-- Minimalist Premium Technology Silhouette -->
  <g transform="translate(100, 100)" stroke="#cccccc" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Sleek Hardware Enclosure -->
    <rect x="20" y="20" width="160" height="160" rx="28" fill="#ffffff" stroke="#d5d5d5" stroke-width="5"/>

    <!-- Camera Array / Sensor Ring -->
    <circle cx="100" cy="85" r="32" stroke="#b8b8b8" stroke-width="5" fill="#f4f4f4"/>
    <circle cx="100" cy="85" r="14" stroke="#999999" stroke-width="4" fill="#e8e8e8"/>
    <circle cx="112" cy="73" r="4" fill="#b0b0b0" stroke="none"/>

    <!-- Subtle Tech Status Indicator & Geometric Base -->
    <line x1="60" y1="145" x2="140" y2="145" stroke="#cccccc" stroke-width="4"/>
    <circle cx="100" cy="145" r="3" fill="#999999" stroke="none"/>
  </g>
</svg>
